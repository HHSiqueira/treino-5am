<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino 5AM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Protocolo 5AM - Treino</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding:14px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));max-width:650px;margin:0 auto}
h1{font-size:1.3rem;color:var(--accent)}
.sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tab{position:relative;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab small{font-size:.7rem}.tab i{font-style:normal;font-size:.68rem;font-weight:700;color:var(--ok)}
.tab.on{background:var(--accent);color:#0f172a;border-color:var(--accent)}.tab.on i{color:#0f172a}
.tab.nx::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
details.cad{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
details.cad summary{font-size:.85rem;font-weight:600;cursor:pointer}
.cadbox{display:flex;gap:12px;align-items:center;margin-top:10px}
.bar{width:18px;height:60px;background:var(--bg);border:1px solid #475569;border-radius:9px;position:relative;overflow:hidden;flex-shrink:0}
.bar b{position:absolute;left:0;width:100%;height:30%;bottom:0;border-radius:9px;background:var(--accent);animation:cad 4s infinite ease-in-out}
@keyframes cad{0%{bottom:0;background:var(--accent)}25%{bottom:70%;background:var(--ok)}35%{bottom:70%;background:var(--warn)}100%{bottom:0;background:var(--accent)}}
.cadbox p{font-size:.78rem;color:var(--muted);line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ti{font-size:1rem;font-weight:700}
.bd{background:var(--bg);color:var(--accent);font-size:.72rem;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap}
.cue{font-size:.8rem;color:var(--muted);line-height:1.4;margin:6px 0 8px}
.hint{font-size:.76rem;color:var(--warn);margin-bottom:8px;line-height:1.35}
.row,.rh{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:6px}
.rh{font-size:.65rem;color:var(--muted);text-align:center;margin-bottom:3px}
.sn{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center}
input{width:100%;height:42px;background:var(--bg);color:var(--text);border:1px solid #475569;border-radius:8px;font-size:16px;text-align:center;padding:0 4px}
input::placeholder{color:#64748b}input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.ck{height:42px;border-radius:8px;border:1px solid #475569;background:var(--bg);color:var(--muted);font-size:1.1rem;font-weight:800;cursor:pointer}
.ck.done{background:var(--ok);border-color:var(--ok);color:#052e16}
.lk{display:inline-block;margin-top:6px;background:#334155;color:#fff;text-decoration:none;font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:6px}
.fin{width:100%;height:50px;background:var(--ok);color:#052e16;border:0;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:4px}
.tb{position:fixed;bottom:0;left:0;right:0;max-width:650px;margin:0 auto;background:#090d16;border-top:1px solid var(--line);padding:9px 12px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:50}
.tl{font-size:.62rem;color:var(--muted)}
#t{font-size:1.5rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:86px}
#t.go{color:var(--ok)}
.pb{display:flex;gap:5px}
.pb button{background:var(--card);color:var(--text);border:1px solid #475569;border-radius:8px;padding:9px 8px;font-size:.78rem;font-weight:600;cursor:pointer}
.pb button.on{background:var(--accent);color:#0f172a;border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#052e16;font-weight:700;font-size:.85rem;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#toast.show{opacity:1}
</style>
</head>
<body>
<h1>Protocolo 5AM • Hipertrofia</h1>
<div class="sub">Upper/Lower (A-B-C-D) • Tensão mecânica (RIR 1-2)</div>
<div class="sub" id="last"></div>
<div class="tabs" id="tabs"></div>
<details class="cad"><summary>Ritmo de execução</summary>
<div class="cadbox"><div class="bar"><b></b></div>
<p><strong>Subida (1s):</strong> explosiva (verde) • <strong>Topo (0.5s):</strong> contrai (amarelo) • <strong>Descida (2.5s):</strong> controlada segurando o peso (azul).</p></div></details>
<div id="list"></div>
<div id="toast"></div>
<div class="tb">
<div><div class="tl">DESCANSO</div><div id="t">01:30</div></div>
<div class="pb" id="pb"><button data-r="60">60</button><button data-r="90">90</button><button data-r="120">120</button><button data-r="180">180</button><button data-r="0">Zerar</button></div>
</div>
<script>
const D={
A:{t:'Treino A',s:'Sup. 1',ex:[
["Supino Inclinado com Halteres",3,"8-10 reps","Banco a 30°. Cotovelos levemente fechados (45° do tronco) para proteger o ombro e alongar o peitoral superior.","Dumbbell+Incline+Bench+Press+form+animation"],
["Puxada Alta na Polia (Pronada)",3,"8-12 reps","Estufe o peito e puxe a barra em direção à clavícula, focando em descer os cotovelos em direção ao quadril.","Lat+Pulldown+form+animation"],
["Supino Reto (Máquina ou Barra)",3,"8-10 reps","Escápulas contraídas no banco. Controle a descida por 2 segundos e empurre sem desencostar os ombros.","Chest+Press+Machine+form+animation"],
["Remada Baixa no Triângulo",3,"8-12 reps","Alongue bem as escápulas na frente sem curvar a lombar e puxe o triângulo até o umbigo.","Seated+Cable+Row+form+animation"],
["Elevação Lateral com Halteres",4,"12-15 reps","Suba os braços levemente à frente do corpo (plano escapular) até a altura dos ombros, sem dar impulso.","Dumbbell+Lateral+Raise+form+animation"],
["Tríceps Corda na Polia",3,"10-12 reps","Cotovelos colados nas costelas. Abra a corda no final do movimento contraindo o tríceps por 1s.","Tricep+Rope+Pushdown+form+animation"],
["Rosca Direta (Polia ou Barra W)",3,"10-12 reps","Sem balançar o tronco. Desça alongando totalmente o bíceps antes da próxima repetição.","EZ+Bar+Curl+form+animation"]]},
B:{t:'Treino B',s:'Inf. 1',ex:[
["Agachamento Hack ou Leg Press 45°",4,"8-10 reps","Pés na largura dos ombros. Desça até pelo menos 90° mantendo o quadril totalmente apoiado no banco.","Leg+Press+form+animation"],
["Cadeira Extensora",3,"10-12 reps","Segure 1 segundo cheio no topo com as pernas esticadas e desça controlando o peso.","Leg+Extension+form+animation"],
["Mesa ou Cadeira Flexora",4,"10-12 reps","Mantenha o quadril pressionado contra o apoio durante toda a flexão dos joelhos.","Seated+Leg+Curl+form+animation"],
["Afundo com Halteres (ou Búlgaro)",3,"8-10 / perna","Tronco levemente inclinado à frente; empurre o chão com o calcanhar da perna da frente.","Dumbbell+Lunge+form+animation"],
["Panturrilha em Pé (Máquina ou Leg)",4,"12-15 reps","Pausa obrigatória de 2 segundos lá embaixo (alongando) e 1 segundo no topo (contraindo).","Standing+Calf+Raise+form+animation"],
["Abdominal Crunch na Polia ou Infra",3,"12-15 reps","Enrole a coluna aproximando as costelas do quadril; solte todo o ar no final da contração.","Cable+Crunch+form+animation"]]},
C:{t:'Treino C',s:'Sup. 2',ex:[
["Remada Máquina (Pegada Aberta) ou Curvada",4,"8-10 reps","Cotovelos mais altos para focar na espessura da parte alta das costas (trapézio e romboides).","Chest+Supported+Row+form+animation"],
["Desenvolvimento com Halteres Sentado",3,"8-10 reps","Desça os halteres até a linha do queixo/orelhas com antebraços verticais e empurre.","Seated+Dumbbell+Shoulder+Press+form+animation"],
["Puxada Alta com Triângulo (Pegada Neutra)",3,"10-12 reps","Foco na parte inferior da dorsal. Puxe os cotovelos para baixo e para trás.","Close+Grip+Lat+Pulldown+form+animation"],
["Crucifixo na Máquina (Peck Deck)",3,"10-12 reps","Sinta o peitoral alongar bem na abertura sem deixar os pesos baterem.","Pec+Deck+Fly+form+animation"],
["Crucifixo Inverso (Posterior de Ombro)",4,"12-15 reps","Empurre as mãos para longe (abrindo o arco) sem juntar demais as escápulas.","Reverse+Pec+Deck+form+animation"],
["Tríceps Francês ou Testa na Polia",3,"10-12 reps","Trabalha o tríceps alongado (cabeça longa). Mantenha os cotovelos apontados para a frente.","Overhead+Cable+Tricep+Extension+form+animation"],
["Rosca Inclinada com Halteres ou Scott",3,"10-12 reps","Mantém o ombro fixo para isolar ao máximo o bíceps sem roubo de tronco.","Incline+Dumbbell+Curl+form+animation"]]},
D:{t:'Treino D',s:'Inf. 2',ex:[
["Stiff ou Levantamento Terra Romeno (RDL)",4,"8-10 reps","Coluna neutra. Jogue o quadril para trás sentindo alongar o posterior de coxa até metade da canela.","Romanian+Deadlift+form+animation"],
["Leg Press 45° (Pés mais altos)",3,"10-12 reps","Pés posicionados mais no alto da plataforma para recrutar mais glúteos e posteriores.","Leg+Press+glute+focus+animation"],
["Cadeira Flexora",3,"10-12 reps","Amplitude máxima e descida lenta de 3 segundos em cada repetição.","Seated+Leg+Curl+form+animation"],
["Cadeira Extensora",3,"12-15 reps","Estímulo metabólico complementar para o quadríceps com controle total.","Leg+Extension+form+animation"],
["Panturrilha Sentado (Máquina)",4,"12-15 reps","Foco no músculo sóleo. Sem quicar o peso embaixo: pare 2 segundos no alongamento.","Seated+Calf+Raise+form+animation"],
["Prancha Abdominal Isométrica",3,"45-60 seg","Contraia glúteos e abdômen como se fosse receber um soco na barriga; não deixe a lombar afundar.","Plank+exercise+form+animation"]]}
};
const LS='p5am-v1',$=id=>document.getElementById(id);
const nextD=k=>'ABCD'[('ABCD'.indexOf(k)+1)%4];
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=()=>({v:1,ts:0,rest:90,tab:null,draft:{},last:{},log:[]});
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=blank()}
if(!D[S.tab]){const l=S.log[S.log.length-1];S.tab=l&&D[l.k]?nextD(l.k):'A'}

function save(){
  S.ts=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
}
function draft(key,n){
  const a=S.draft[key]=S.draft[key]||[];
  while(a.length<n)a.push({w:'',r:'',d:0});
  return a;
}
function topReps(s){if(/seg/.test(s))return 0;const m=s.match(/(\d+)-(\d+)/);return m?+m[2]:0}
function prog(k){let d=0,t=0;D[k].ex.forEach((e,i)=>{t+=e[1];(S.draft[k+i]||[]).slice(0,e[1]).forEach(s=>{if(s.d)d++})});return d+'/'+t}
function fmtDate(iso){const p=iso.split('-');return p[2]+'/'+p[1]}

function render(){
  const lg=S.log[S.log.length-1];
  $('last').textContent=lg&&D[lg.k]?'Último treino: '+D[lg.k].t+' em '+fmtDate(lg.d):'';
  const nx=lg&&D[lg.k]?nextD(lg.k):'A';
  $('tabs').innerHTML=Object.keys(D).map(k=>`<button class="tab${k===S.tab?' on':''}${k===nx?' nx':''}" data-k="${k}"><b>${D[k].t}</b><small>${D[k].s}</small><i id="p${k}">${prog(k)}</i></button>`).join('');
  const k=S.tab;
  $('list').innerHTML=D[k].ex.map((e,i)=>card(k,i,e)).join('')+'<button class="fin" id="fin">Finalizar treino</button>';
  document.querySelectorAll('#pb button').forEach(b=>b.classList.toggle('on',+b.dataset.r===S.rest));
  if(!endAt)$('t').textContent=fmt(S.rest);
}
function card(k,i,e){
  const key=k+i,n=e[1],dr=draft(key,n),la=S.last[key];
  let hint='';
  if(la&&la.length){
    const top=topReps(e[2]);
    const hit=top&&la.length>=n&&la.every(x=>+x.w>0&&+x.r>=top);
    hint=hit?'Bateu o topo da faixa na última vez: tente subir um pouco a carga.':'Última: '+la.map(x=>(x.w||'?')+'×'+(x.r||'?')).join(' • ');
  }
  let rows='';
  for(let s=0;s<n;s++){
    const ph=la&&la[s]?la[s]:{};
    rows+=`<div class="row" data-key="${key}" data-i="${s}"><span class="sn">S${s+1}</span>`
     +`<input inputmode="decimal" data-f="w" placeholder="${esc(ph.w||'kg')}" value="${esc(dr[s].w)}">`
     +`<input inputmode="numeric" data-f="r" placeholder="${esc(ph.r||'reps')}" value="${esc(dr[s].r)}">`
     +`<button class="ck${dr[s].d?' done':''}" data-act="ck">✓</button></div>`;
  }
  return `<div class="card"><div class="hd"><div class="ti">${i+1}. ${e[0]}</div><div class="bd">${n}x • ${e[2]}</div></div>`
   +`<div class="cue">${e[3]}</div>${hint?`<div class="hint">${esc(hint)}</div>`:''}`
   +`<div class="rh"><span></span><span>KG</span><span>REPS</span><span></span></div>${rows}`
   +`<a class="lk" href="https://www.youtube.com/results?search_query=${e[4]}" target="_blank" rel="noopener">▶ Ver Animação 3D</a></div>`;
}

$('tabs').addEventListener('click',ev=>{
  const b=ev.target.closest('.tab');if(!b)return;
  S.tab=b.dataset.k;render();save();window.scrollTo(0,0);
});
$('list').addEventListener('input',ev=>{
  const inp=ev.target.closest('input[data-f]');if(!inp)return;
  const row=inp.closest('.row'),dr=S.draft[row.dataset.key];if(!dr)return;
  dr[+row.dataset.i][inp.dataset.f]=inp.value.replace(',','.');
  save();
});
$('list').addEventListener('click',ev=>{
  if(ev.target.closest('#fin')){finish();return}
  const b=ev.target.closest('[data-act="ck"]');if(!b)return;
  const row=b.closest('.row'),key=row.dataset.key,i=+row.dataset.i;
  const s=S.draft[key][i],la=S.last[key]&&S.last[key][i];
  s.d=s.d?0:1;
  if(s.d){
    const ins=row.querySelectorAll('input');
    if(!s.w&&la&&la.w){s.w=la.w;ins[0].value=la.w}
    if(!s.r&&la&&la.r){s.r=la.r;ins[1].value=la.r}
    startT(S.rest);
  }
  b.classList.toggle('done',!!s.d);
  $('p'+S.tab).textContent=prog(S.tab);
  save();
});
function finish(){
  const k=S.tab,got={};let cnt=0;
  D[k].ex.forEach((e,i)=>{
    const done=(S.draft[k+i]||[]).slice(0,e[1]).filter(s=>s.d).map(s=>({w:s.w,r:s.r}));
    if(done.length){got[k+i]=done;cnt+=done.length}
  });
  if(!cnt){toast('Marque ao menos uma série',1);return}
  Object.assign(S.last,got);
  D[k].ex.forEach((e,i)=>{delete S.draft[k+i]});
  S.log.push({d:new Date().toISOString().slice(0,10),k:k,n:cnt});
  S.log=S.log.slice(-90);
  S.tab=nextD(k);
  render();save();window.scrollTo(0,0);toast('Treino salvo ✔');
}
let toastT;
function toast(m,warn){
  const el=$('toast');el.textContent=m;el.style.background=warn?'#f59e0b':'';
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

/* Cronômetro */
let endAt=0,iv=null,ctx=null,wl=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startT(sec){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}
  try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(e){}
  endAt=Date.now()+sec*1000;clearInterval(iv);iv=setInterval(tick,250);tick();
}
function tick(){
  const r=Math.ceil((endAt-Date.now())/1000),t=$('t');
  if(r<=0){clearInterval(iv);endAt=0;t.textContent='PRONTO!';t.classList.add('go');alarm();return}
  t.classList.remove('go');t.textContent=fmt(r);
}
function alarm(){
  try{if(navigator.vibrate)navigator.vibrate([250,120,250,120,400])}catch(e){}
  try{
    if(!ctx)return;
    [0,.3,.6].forEach(d=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.25,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.22);
      o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.25);
    });
  }catch(e){}
}
$('pb').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const r=+b.dataset.r;
  if(!r){clearInterval(iv);endAt=0;$('t').classList.remove('go');$('t').textContent=fmt(S.rest);return}
  S.rest=r;document.querySelectorAll('#pb button').forEach(x=>x.classList.toggle('on',+x.dataset.r===r));
  startT(r);save();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&endAt)tick()});

render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
